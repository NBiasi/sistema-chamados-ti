# --- Ligação à Base de Dados MySQL ---
spring.datasource.url=jdbc:mysql://localhost:3306/sistema_chamados_ti?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&useUnicode=true
spring.datasource.username=sistema_user
spring.datasource.password=sistema_pass
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- Configuração JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

logging.level.br.gov.to.prefeitura.colinas.sistema_chamados_ti=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:4200,http://localhost:5500}

# --- Hikari: Configuração de Conexão ---
spring.datasource.hikari.initialization-fail-timeout=120000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-test-query=SELECT 1

logging.level.com.zaxxer.hikari=DEBUG
logging.level.org.springframework.jdbc=DEBUG

# --- Configuração de Segurança JWT ---
app.jwt.secret=${APP_JWT_SECRET:dev-secret-nao-use-em-producao-1234567890-abcdefghij}

# Token de Visitante: Válido por exatamente 4 horas (14.400.000 ms)
app.jwt.expiration-visitor=14400000

# Token de Usuário Logado: Tempo indeterminado (~1000 anos = 31.536.000.000.000 ms)
app.jwt.expiration-user=31536000000000

# --- Actuator, Monitoramento e Logs (FASE 6) ---
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always

# Formatação de logs em JSON nativo para fácil ingestão no ELK/Loki
logging.pattern.console={"@timestamp":"%d{yyyy-MM-dd'T'HH:mm:ss.SSSZ}","level":"%level","thread":"%thread","logger":"%logger{36}","message":"%msg"}%n

# --- Configuração de Proxy Reverso (Nginx) ---
server.forward-headers-strategy=framework